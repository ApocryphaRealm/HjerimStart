; Alternate Perspective Hjerim Addon
;
; An add-on for Alternate Perspective. Its menu's "My own Home" card gains Windhelm beside Whiterun,
; Solitude, Riften and Markarth: choose it, walk through the door, and the game begins inside Hjerim,
; the house in Windhelm, already yours - the deed, the key, the decorating guide, and every room
; furnished. No steward, no gold.
;
; This file is the only place these are set - the mod has no in-game menu page. Edit it with the game
; closed; it is read when the game starts.

[General]
; 1 runs the start, 0 leaves the option in Alternate Perspective's menu but makes choosing it do
; nothing - a way to switch it off without uninstalling mid-playthrough.
bEnabled=1

; Seconds to wait after Alternate Perspective starts this mod's quest before acting.
;
; AP is still finishing its own hand-off at that moment: it fades the screen, freezes the player,
; and then watches to see whether the chosen start moves them out of the start cell. Waiting a
; moment lets the fade cover the arrival. Waiting too long trips AP's own safety net, which says
; "You seem to be stuck. I'll move you into the Helgen Inn." and puts you in Helgen instead.
; Raise it a little if you ever arrive back in the Resting Pilgrim; lower it if you ever land in Helgen.
fStartDelaySeconds=0.25

; The beat between the parts of the start: the move, then the deed and key, then one room's
; furniture at a time.
;
; They are deliberately NOT done in one frame. A cross-cell teleport and eight rooms of furniture
; appearing at once is a lot of 3D work for every mod that rebuilds itself from the loaded cell.
; It is also how often the mod looks to see whether you have finished arriving - nothing is handed
; over until you are actually standing in Hjerim, however long the load takes.
;
; Raise it to make the start gentler and slower. 0 puts everything back into one frame.
fStageGapSeconds=0.15

[Start]
; Move the player into Hjerim's main hall. 0 hands the house over wherever you are.
bMoveToHjerim=1

; Furnish every room the steward would sell - kitchen, living room, bedroom, enchanting and alchemy
; laboratories, armory and displays, guest room, basement lights - in one go. 0 gives the house with
; its basic furnishing only, as the sale itself does.
;
; This works through the game's own furnishing markers, the same ones the steward's dialogue enables,
; so a mod that refurnishes or improves Hjerim sees exactly what it would see after buying every room.
bFurnishEveryRoom=1

; Hjerim is the Butcher's house, and the game only sells it once Blood on the Ice is closed. What this
; start does about that case:
;   0  leave it alone   - the case plays as usual and the grisly clutter stays until you solve it
;   1  mark it solved   - the state the game itself reaches when the case is closed (the default)
;   2  turn it off      - stops the quest, claiming nothing in your journal
; 1 and 2 both clear the clutter in the hidden room.
uBloodOnTheIce=1

; Only matters when the case is left alone (uBloodOnTheIce=0): the clutter stays until Blood on the
; Ice is COMPLETED, then goes, as the steward's "clean up the mess" would have removed it. 0 leaves it
; for the steward's purchase.
bCleanUpAfterBloodOnTheIce=1

[Debug]
; How much detail reaches
; Documents\My Games\Skyrim Special Edition\SKSE\HjerimStart.log
;   0 trace (shipped default - every decision this mod makes)
;   1 debug   2 info   3 warning   4 error   5 critical   6 off
; It ships at 0 so a bug report arrives with the log already complete.
uLogLevel=0
